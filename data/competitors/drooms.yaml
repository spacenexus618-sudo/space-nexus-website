# Key Differentiators
differentiators:
  - European Digital Sovereignty — 100% EU-owned, EU-hosted, GDPR-compliant
  - In-house AI — all AI features developed internally; data never leaves platform
  - Drooms Intelligence (Aug 2026) — query entire data room in natural language
  - Real Estate LIFECYCLE — only VDR offering full buy-hold-sell asset lifecycle
  - 7-language document translation — built-in OCR-based
  - 25-year track record — longest-operating European VDR provider
  - Drooms Hub model — pay for storage + users, not per data room

# Competitive Positioning
positioning: >
  Drooms is the dominant European VDR, strongest in German-speaking markets and real estate.
  Its sovereignty positioning and in-house AI are genuine differentiators. However, it trails
  global competitors in English-market reviews, mobile experience, and feature completeness.
  Premium pricing with aggressive scaling makes it best suited for EU-focused, compliance-heavy
  transactions.

# Common Complaints (from reviews)
common_complaints:
  - "Expensive" — per-user + storage-band scaling adds up fast
  - "Dated UI" — steep learning curve
  - "No mobile app" — no Android app as of 2026
  - "No e-signatures" — requires separate tool
  - "No screenshot protection" — lacks Fence View

# SpaceNexus Competitive Angle
spacenexus_angle: >
  SpaceNexus offers transparent published pricing vs Drooms' premium scaling model,
  modern mobile-friendly UX vs dated interface, and built-in e-signatures vs separate tool requirement.
