# Product Features
features:
  core_platform:
    - Structured document management & indexing
    - Granular permission controls & access management
    - Full audit trails & activity reporting
    - Q&A workflows with approval routing
    - Chat collaboration
    - OCR-based advanced search
    - Secure file sharing via links
    - Online Archive for post-transaction storage
    - Drooms LIFECYCLE (asset lifecycle management for real estate)
  
  ai_capabilities:
    - AI Assistant — conversational Q&A across entire data room
    - Auto Allocation — auto-organizes files into correct folders
    - Auto Naming — suggests accurate document names
    - Redaction — one-click confidential info protection
    - Document Translation — instant OCR-based translation (7 languages)
    - Drooms Intelligence (Aug 2026) — natural language analysis with source-linked answers
    - Customer docs NOT used to train public AI models
  
  security:
    - AES-256 encryption at rest
    - SSL/TLS encryption in transit
    - ISO 27001 & ISO 27018 certified
    - TÜV certified
    - GDPR-compliant
    - 100% European data sovereignty (servers in Germany & Switzerland)
    - 99.9% uptime
    - Two-factor authentication
    - No exposure to US CLOUD Act

# Target Audience
target_audience:
  - Real estate firms & asset managers
  - M&A advisory & investment banks
  - Private equity & venture capital
  - Legal firms (due diligence)
  - Fund managers
  - Corporate finance professionals
  - Fundraising founders
  - NPL (Non-Performing Loan) portfolios
  - Industries: Finance/Insurance (22%), Professional Services (19%), Real Estate (16%)

# Strengths
strengths:
  - 25 years of European VDR expertise — first mover in Europe
  - 100% European digital sovereignty — critical differentiator post-CLOUD Act
  - Proprietary in-house AI — not reliant on third-party AI services
  - Strongest real estate focus — Findings Manager with NLP for property DD
  - 7-language document translation built-in
  - ISO 27001/27018, TÜV certified — enterprise-grade security
  - 24/7/365 expert support with dedicated project managers
  - High Capterra rating (4.5/5) with strong customer service (4.7)
  - LIFECYCLE product for full asset lifecycle management — unique
  - Drooms Intelligence — latest AI product making entire data room queryable

# Weaknesses
weaknesses:
  - High price — per-user + storage-band scaling adds up fast
  - Poor/non-intuitive UI — steep learning curve
  - No native mobile app (no Android app as of 2026)
  - No screenshot protection / Fence View
  - No built-in e-signatures
  - Limited English-language reviews — only 3 G2 reviews, 38 Capterra
  - 10 GB storage cap forces Enterprise quote for large deals
  - File download issues — not always reliable
  - Slow document preview loading
  - File search ineffective for some extensions
  - Redaction could be more efficient
  - Per-page analytics absent — only document-level tracking

# Best For
best_for:
  - European M&A transactions requiring GDPR compliance & data sovereignty
  - Real estate dealmaking — strongest vertical specialization
  - Cross-border European deals needing multi-language document translation
  - Regulated industries where data must stay within EU jurisdiction
  - Asset lifecycle management — buy-hold-sell cycle on one platform
  - NPL portfolio transactions
  - Teams wanting in-house AI that never sends data to external services

# Not Ideal For
not_ideal_for:
  - US-based organizations needing HIPAA/FISMA compliance or US data residency
  - Budget-sensitive teams — pricing is premium and scales aggressively
  - Mobile-first teams — no dedicated Android/iOS apps
  - Teams needing e-signatures — must use separate tool
  - Screenshot-protection requirements
  - Large document libraries (10 GB+) on self-service plans
  - Non-European markets — limited global data center presence

