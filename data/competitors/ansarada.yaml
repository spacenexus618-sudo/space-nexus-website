# Key Differentiators
differentiators:
  - AI-Predict (Bidder Scoring) — claims 97% accuracy predicting winning buyer by day 7
  - AI-Native Architecture — rebuilt from ground up around AI (RAG, semantic search)
  - Free Preparation Phase — no charges until first external guest
  - Unlimited Users — no per-seat pricing
  - Deal Readiness Assets — pre-built templates from 30,000+ deals
  - Procure Module — purpose-built for infrastructure procurement
  - Remote Document Destruct — revoke access even after documents leave room
  - Data Gauge — shows estimated costs before commitment

# Competitive Positioning
positioning: >
  Ansarada is the AI-native VDR leader in ANZ/Benelux. It wins on AI capabilities,
  unlimited users, and free preparation phase. It loses on pricing predictability,
  UI modernity, and mobile experience. The ideal competitive angle is to attack
  pricing unpredictability and dated interface while acknowledging AI strengths.

# Common Complaints (from reviews)
common_complaints:
  - "Expensive" — storage-based model causes surprise charges
  - "Dated UI" — described as "early 2000s software"
  - "AI unreliable" — AiDA called disconnected by some
  - "Mobile experience" — no robust native app
  - "Vendor lock-in" — switching mid-deal extremely costly

# SpaceNexus Competitive Angle
spacenexus_angle: >
  SpaceNexus offers transparent published pricing vs Ansarada's unpredictable storage-based model,
  modern UX vs dated interface, and setup in under 24 hours with no vendor lock-in.
