# Key Differentiators
differentiators:
  - First VDR with MCP server — AI assistants work inside the data room
  - Blueflame AI — enterprise-grade semantic search acquired in 2025
  - End-to-end deal lifecycle — not just a data room
  - ISO 42001 certified — first VDR for responsible AI governance
  - 50 years of M&A-specific expertise
  - Unlimited users — no per-seat scaling penalty
  - Acquired Firmex — owns both premium and value market segments

# Competitive Positioning
positioning: >
  Datasite is the premium, AI-innovative VDR leader. It wins on ease of use, AI capabilities,
  and security certifications. It loses on pricing opacity and premium costs. The ideal competitive
  angle is to attack pricing transparency, cost, and setup speed while acknowledging their
  AI and security strengths.

# Common Complaints (from reviews)
common_complaints:
  - "Expensive" — most frequent complaint
  - "Opaque pricing" — no published tiers
  - "Slow performance" — login delays, document loading
  - "Complex access control" — steep learning curve for permissions
  - "Storage overage costs" — surprise charges

# SpaceNexus Competitive Angle
spacenexus_angle: >
  SpaceNexus offers transparent published pricing vs Datasite's opaque quotes,
  AI document redaction built-in vs expensive add-ons, and setup in under 24 hours
  vs days-long onboarding.
