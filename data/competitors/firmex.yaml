# Key Differentiators
differentiators:
  - Q&A module maturity — most sophisticated in mid-market VDR category
  - Project-based pricing model — clean economics for time-boxed deals
  - 24/7 in-house support — not outsourced; multilingual
  - Datasite backing — access to enterprise infrastructure
  - 200,000+ deal track record
  - Canadian sovereignty option — Toronto-headquartered
  - Pre-built templates — dozens of customizable project templates
  - No per-page pricing — project-based not metered by pages

# Competitive Positioning
positioning: >
  Firmex is a reliable, mid-market VDR with the strongest Q&A workflow in its category
  and excellent 24/7 support. It excels for time-boxed M&A and legal diligence with clean
  project economics. However, it loses ground to modern alternatives on pricing transparency,
  AI capabilities, analytics depth, and flexibility for ongoing workflows.

# Common Complaints (from reviews)
common_complaints:
  - "Expensive" — per-project pricing scales poorly
  - "Opaque pricing" — no public tiers
  - "Slow onboarding" — sales-led, 1-2 weeks setup
  - "Limited AI" — basic auto-categorization only
  - "No page analytics" — file-level tracking only

# SpaceNexus Competitive Angle
spacenexus_angle: >
  SpaceNexus offers transparent published pricing vs Firmex's opaque per-project model,
  AI document redaction built-in vs basic auto-categorization, and setup in under 24 hours
  vs 1-2 week onboarding.
