# Firmex — Competitor Profile
# Last Updated: September 9, 2026

name: Firmex
website: https://www.firmex.com
founded: 2006
headquarters: Toronto, Canada
ownership: Acquired by Datasite (July 2021)
employees: ~186
revenue: ~$12M (estimated)
market_position: Mid-market VDR leader in North America

# Company Scale
scale:
  new_rooms_per_year: "20,000+"
  total_companies: "223,000+"
  total_users: "1.4M+"
  countries: "180+"
  deals_since_2006: "200,000+"

# Pricing
pricing:
  model: Per-project or annual subscription
  estimated_tiers:
    starter: "$625–$995/month"
    mid_market: "$5,000–$10,000 per 3 months"
    enterprise: "$25,000+/year (custom)"
    per_deal: "Custom quote"
  hidden_costs:
    - Project extension fees: +25–50% on original quote
    - Multi-room engagements: each room separate quote
    - Per-user upcharges on entry plans
    - Storage overage for document-heavy deals
    - Renewal pricing may reset at contract renewal
  verdict: No public pricing. Project-based model works for clean deals but becomes expensive for extended or parallel engagements.

# Product Features
features:
  core_features:
    - Drag-and-drop upload (up to 50 GB files)
    - Bulk folder management
    - Version control with full document history
    - Folder hierarchy with nesting and automatic indexing
    - Full-text search across documents
    - Multi-format support (PDF, DOCX, XLSX, PPTX, images)
    - Pre-configured, customizable templates
    - API access (enterprise tier)
  
  qa_module:
    - Structured question routing with role-based answer assignment
    - Per-bidder scoping (competitive bid isolation)
    - Question threads tied to specific documents
    - Q&A export for deal records
    - Notification rules for new questions/answers
  
  security:
    - SOC 2 Type II (audited annually)
    - GDPR aligned
    - HIPAA-ready workflows (life sciences)
    - AES-256 encryption at rest, TLS 1.2+ in transit
    - Annual penetration testing
    - ISO 27001 alignment via infrastructure
  
  ai_capabilities:
    - Limited — basic auto-categorization only
    - No AI-powered deal intelligence, predictive analytics, or semantic search
    - Notable gap vs competitors

# Target Audience
target_audience:
  - M&A boutiques and investment banks (mid-market)
  - Law firms (legal due diligence, litigation)
  - Private equity and venture capital
  - Corporate development teams
  - Life sciences / biotech
  - Accounting firms (audits, compliance)
  - Strongest in Canadian and US mid-market

# Strengths
strengths:
  - Best-in-class Q&A workflow — role-based routing, per-bidder scoping
  - 24/7 expert support included on all paid plans (in-house, not outsourced)
  - Strong compliance posture — SOC 2 Type II, GDPR, HIPAA, AES-256
  - Project-based economics — clean price for time-boxed deals
  - Solid track record — 200,000+ deals since 2006
  - Professional, lean interface — purpose-built for legal/M&A
  - Multilingual — English, French, German, Spanish
  - Customizable templates — dozen+ pre-configured data room templates

# Weaknesses
weaknesses:
  - Per-project pricing scales poorly — deals extending past 3 months re-quoted at +25–50%
  - No public pricing — every quote requires a sales call
  - Sales-led onboarding — 1–2 weeks typical setup time
  - Limited AI capabilities — no predictive analytics, bidder scoring, or semantic search
  - No page-by-page analytics — file-level tracking only
  - Limited custom branding on entry plans
  - Cloud-only — no self-hosted option
  - Occasional lag with large uploads
  - Mobile app UX needs improvement
  - Limited customization options

# Best For
best_for:
  - Time-boxed M&A deals that close in 90–180 days
  - Mid-market legal due diligence with structured Q&A
  - Competitive bid processes where per-bidder Q&A scoping matters
  - Teams that need 24/7 support during transaction-critical moments
  - Canadian-headquartered vendor preference
  - Organizations with historical Firmex familiarity

# Not Ideal For
not_ideal_for:
  - Long-running projects (6+ months) — per-project pricing becomes punitive
  - Multiple concurrent data rooms — each room re-quoted separately
  - Teams needing AI-powered features
  - Budget predictability requirements
  - Self-hosting requirements
  - Small deals / startups
  - Teams needing page-level analytics
  - Custom domain / white-label needs on tight budgets

